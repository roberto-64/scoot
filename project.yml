name: ScooterLog
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "12"
targets:
  ScooterLog:
    type: application
    platform: iOS
    sources:
      - path: ScooterLog
    info:
      path: ScooterLog/Info.plist
      properties:
        CFBundleDisplayName: Scoot
        CFBundleDevelopmentRegion: it
        CFBundleLocalizations: [it, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Sblocca Scoot con Face ID.
        NSCameraUsageDescription: Scoot usa la fotocamera per allegare foto a manutenzioni e spese.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.personal.scooterlog.newfuel
            UIApplicationShortcutItemTitle: Nuovo rifornimento
            UIApplicationShortcutItemIconSymbolName: fuelpump
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.scooterlog
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
